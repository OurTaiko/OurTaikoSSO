{% load i18n %}<footer class="site-footer"><div class="wrap"><span>{% translate 'OurTaiko 账号中心' %}{% if dev_mode %} <span class="environment"><span></span>{% translate '本地开发环境' %}</span>{% endif %}</span><form class="langs" action="{% url 'set-language' %}" method="post" aria-label="{% translate '语言' %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">{% for code, name in supported_languages %}<button type="submit" name="language" value="{{ code }}" lang="{{ code }}"{% if code == LANGUAGE_CODE %} aria-current="true"{% endif %}>{{ name }}</button>{% endfor %}</form></div></footer>
