{% load i18n %}{% if form.non_field_errors %}<div class="notice error" role="alert"><svg><use href="#i-alert"/></svg>{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}<div class="field{% if field.errors %} invalid{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<div class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}{% if field.errors %}<div class="field-error" role="alert">{{ field.errors }}</div>{% endif %}</div>{% endfor %}
