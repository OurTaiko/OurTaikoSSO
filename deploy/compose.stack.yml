# Portable account-center stack. The legacy 1Panel compose.yml is unchanged.
name: ${SSO_PROJECT:-ourtaiko-sso-local}
services:
  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    shm_size: 128mb
    env_file:
      - path: ${STACK_DIR:?Set STACK_DIR}/postgres.env
        format: raw
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-15433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [shared]
  sso:
    image: ${SSO_IMAGE:-ourtaiko-sso:local}
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ${STACK_DIR:?Set STACK_DIR}/sso.env
        format: raw
    environment:
      SSO_LISTEN_ADDR: 0.0.0.0:8090
      OIDC_PRIVATE_KEY_FILE: /app/.data/oidc-private.pem
    volumes:
      - sso-data:/app/.data
    ports:
      - '127.0.0.1:${SSO_PORT:-18090}:8090'
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ['CMD', 'python', 'deploy/healthcheck.py']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [shared]
volumes:
  postgres:
  sso-data:
networks:
  shared:
    name: ${OURTAIKO_NETWORK:-ourtaiko-local}
