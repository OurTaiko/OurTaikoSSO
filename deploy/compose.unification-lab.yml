# Isolated local development only. Contains synthetic identities and test secrets.
name: ourtaiko-unification-lab
services:
  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    env_file: ../.data/unification-lab/postgres.env
    volumes: [database:/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sso']
      interval: 3s
      timeout: 3s
      retries: 20
  sso:
    image: ourtaiko-sso:unification-dev
    build: ..
    env_file: ../.data/unification-lab/sso.env
    environment:
      SSO_LISTEN_ADDR: 0.0.0.0:8090
      OIDC_PRIVATE_KEY_FILE: /app/.data/oidc-private.pem
    ports: ['127.0.0.1:28090:8090']
    volumes: ['../.data/unification-lab/oidc-private.pem:/app/.data/oidc-private.pem:ro']
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ['CMD', 'python', 'deploy/healthcheck.py']
      interval: 5s
      timeout: 3s
      retries: 20
  fanmade:
    image: ourtaiko-fanmade:unification-dev
    build: ../../Fanmade/backend
    env_file: ../.data/unification-lab/fanmade.env
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      STORAGE_DIR: /data/files
    ports: ['127.0.0.1:28080:8080']
    volumes: ['files:/data/files']
    depends_on:
      sso: {condition: service_healthy}
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=128m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/readyz']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  database:
  files:
