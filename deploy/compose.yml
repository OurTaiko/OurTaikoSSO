services:
  sso:
    image: ourtaiko-sso:release
    container_name: ourtaiko-sso
    network_mode: host
    restart: unless-stopped
    env_file:
      - /etc/ourtaiko-sso/sso.env
    volumes:
      - /var/lib/ourtaiko-sso:/app/.data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "deploy/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
